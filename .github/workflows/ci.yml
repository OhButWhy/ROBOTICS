name: ROS checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:jazzy-desktop-full
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pip
          pip3 install --break-system-packages -q catkin_pkg empy==3.3.4 lark

      - name: Build turtle_bringup
        shell: bash
        run: |
          set -o pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup \
            2>&1 | tee /tmp/build-ci.txt
          cat /tmp/build-ci.txt

      - name: Check installed sim.launch.py
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          test "$(ros2 pkg prefix turtle_bringup)" != "/opt/ros/jazzy" \
            || { echo "turtle_bringup не из workspace"; exit 1; }
          ls "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"

      - name: Validate launch syntax
        shell: bash
        run: python3 -m py_compile src/turtle_bringup/launch/sim.launch.py

      - name: Download course kit
        env:
          COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w02-92fade3ae722.tar.gz
          COURSE_KIT_SHA256: d7a91525ae6ab871d133df94d2e3fdad0dcd954c4206d657c961d86f622b7be6
        shell: bash
        run: |
          curl -fsSLo /tmp/course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf /tmp/course-kit.tar.gz -C .course-kit

      - name: Check PR02 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR02 --submission .