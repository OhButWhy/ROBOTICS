name: ROS checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:jazzy-desktop-full
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pip
          pip3 install --break-system-packages -q catkin_pkg empy==3.3.4 lark

      - name: Build patrol
        shell: bash
        run: |
          set -o pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select patrol 2>&1 | tee /tmp/build-patrol.txt
          cat /tmp/build-patrol.txt

      - name: Test patrol
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select patrol --event-handlers console_direct+
          colcon test-result --verbose

      - name: Download course kit
        env:
          COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w05-bca214e3de6f.tar.gz
          COURSE_KIT_SHA256: bca214e3de6f90f9513049dfa0f36fee65ad834da502dc3f3f8fb443517b5197
        shell: bash
        run: |
          curl -fsSLo /tmp/course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf /tmp/course-kit.tar.gz -C .course-kit

      - name: Check PR04 evidence
        run: python3 .course-kit/v1/tools/check_practice.py PR05 --submission .