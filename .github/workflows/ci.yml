name: ROS checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:jazzy-desktop-full
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools and Nav2 dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pip \
            ros-jazzy-nav2-amcl ros-jazzy-nav2-map-server \
            ros-jazzy-nav2-lifecycle-manager ros-jazzy-tf2-ros-py \
            ros-jazzy-tf2-tools
          pip3 install --break-system-packages -q catkin_pkg empy==3.3.4 lark

      - name: Build localization_case
        shell: bash
        run: |
          set -o pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select localization_case 2>&1 | tee /tmp/build.txt
          cat /tmp/build.txt

      - name: Test localization_case
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select localization_case --event-handlers console_direct+
          colcon test-result --verbose

      - name: Download course kit
        env:
          COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w11-0b67bfd41448.tar.gz
          COURSE_KIT_SHA256: 0b67bfd41448549d21122124b7f49211ba2cd068cc56751871f319eadeb9d0ab
        shell: bash
        run: |
          curl -fsSLo /tmp/course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf /tmp/course-kit.tar.gz -C .course-kit

      - name: Check PR08 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR08 --submission .